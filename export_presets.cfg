package/signed=true
launcher_icons/main_192x192="res://icon.png"
launcher_icons/adaptive_foreground_432x432="res://icon_fg432.png"
launcher_icons/adaptive_background_432x432="res://icon_fg432.png"
permissions/vibrate=true
screen/immersive_mode=true
version/code=1
version/name="0.1.0"

[preset.1]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
